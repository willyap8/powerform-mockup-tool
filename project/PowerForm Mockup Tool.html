<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PowerForm Mockup Tool</title>
<style>
  html, body { margin: 0; padding: 0; background: #f5f5f7; overflow: hidden; height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }

  /* Tame default input styling so PowerForm controls look right */
  input::-webkit-outer-spin-button,
  input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type=number] { -moz-appearance: textfield; }
  select { -webkit-appearance: menulist; appearance: menulist; }

  /* Print styles — only the print-preview canvas is printable */
  @media print {
    body { background: #fff !important; overflow: visible !important; }
    body > *:not(.print-print-wrap) { display: none !important; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="constants.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="blocks.jsx"></script>
<script type="text/babel" src="toolbar.jsx"></script>
<script type="text/babel" src="menus.jsx"></script>
<script type="text/babel" src="storage.jsx"></script>
<script type="text/babel" src="panels.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
