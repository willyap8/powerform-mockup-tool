<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PowerForm Mockup Tool</title>
<style>
  html, body { margin: 0; padding: 0; background: #f5f5f7; overflow: hidden; height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }

  /* Tame default input styling so PowerForm controls look right */
  input::-webkit-outer-spin-button,
  input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type=number] { -moz-appearance: textfield; }
  select { -webkit-appearance: menulist; appearance: menulist; }

  /* Print styles — only the print-preview canvas is printable */
  @media print {
    body { background: #fff !important; overflow: visible !important; }
    body > *:not(.print-print-wrap) { display: none !important; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#f5f5f7">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <!-- Form Heading bar (Verdana navy) -->
    <rect x="240" y="180" width="720" height="60" fill="rgb(0, 48, 135)" />
    <rect x="252" y="200" width="220" height="22" fill="#ffffff" opacity="0.95" rx="2" />
    <!-- Heading 1 (yellow) -->
    <rect x="240" y="260" width="720" height="48" fill="rgb(255, 200, 69)" />
    <rect x="252" y="276" width="180" height="18" fill="rgb(0, 0, 128)" opacity="0.85" rx="2" />
    <!-- Field row -->
    <rect x="240" y="328" width="180" height="36" fill="#ffffff" stroke="#7F9DB9" />
    <rect x="430" y="328" width="180" height="36" fill="#FFFF99" stroke="#7F9DB9" />
    <rect x="620" y="328" width="180" height="36" fill="#ffffff" stroke="#7F9DB9" />
    <rect x="810" y="328" width="150" height="36" fill="#ffffff" stroke="#7F9DB9" />
    <!-- Heading 2 (orange) -->
    <rect x="240" y="380" width="720" height="40" fill="rgb(237, 125, 49)" />
    <rect x="252" y="394" width="160" height="14" fill="#ffffff" opacity="0.95" rx="2" />
    <!-- Field row 2 -->
    <rect x="240" y="436" width="240" height="36" fill="#ffffff" stroke="#7F9DB9" />
    <rect x="490" y="436" width="240" height="36" fill="#ffffff" stroke="#7F9DB9" />
    <rect x="740" y="436" width="220" height="36" fill="#ffffff" stroke="#7F9DB9" />
    <!-- Sub-Section (green) -->
    <rect x="240" y="488" width="720" height="32" fill="rgb(112, 173, 71)" />
    <!-- Textarea -->
    <rect x="240" y="536" width="720" height="80" fill="#ffffff" stroke="#7F9DB9" />
    <!-- Sticky note -->
    <g transform="translate(990, 280)">
      <rect width="170" height="120" fill="#fff59d" stroke="#e6cc44" />
      <rect width="170" height="20" fill="#fbe57c" stroke="#e6cc44" />
      <rect x="10" y="36" width="140" height="6" fill="#b5a13a" opacity="0.5" />
      <rect x="10" y="50" width="120" height="6" fill="#b5a13a" opacity="0.5" />
      <rect x="10" y="64" width="130" height="6" fill="#b5a13a" opacity="0.5" />
    </g>
  </svg>
</template>
<div id="root"></div>
<script type="text/babel" src="constants.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="blocks.jsx"></script>
<script type="text/babel" src="toolbar.jsx"></script>
<script type="text/babel" src="menus.jsx"></script>
<script type="text/babel" src="panels.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
